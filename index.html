<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True/False</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            background-color: black;
        }

        input {
            height: 25px;
            width: 80%;
            max-width: 300px;
            padding: 12px 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 0 12px white;
            transition: .3s;
        }

        input:hover {
            box-shadow: 0 0 15px white;
        }

        button {
            margin-top: 20px;
            width: 100px;
            height: 40px;
            font-size: 15px;
            font-weight: 600;
            background: none;
            color: blue;
            border-color: blue;
            transition: .5s;
        }

        button:hover {
            box-shadow: 0 0 10px blue;
        }

        #Result {
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 20px;
            list-style: none;
            font-weight: bold;
        }
        #Result:hover{
            box-shadow: 0 0 10px white;
        }
        
        .success {
            color: white;
            background: none;
            border: 2px solid white;
            padding: 12px 25px;
            border-radius: 10px;
        }
        .success:hover{
            border: 4px solid white;
        }

        .error {
            color: white;
            background: none;
            border: 2px solid crimson;
            padding: 12px 25px;
            border-radius: 10px;
        }
        .error:hover{
            border: 4px solid crimson;
        }

        .warning {
            color: white;
            background: none;
            border: 2px solid yellow;
            padding: 12px 25px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <input id="inputpass" placeholder="Enter the value">
    <button id="checkbtn">Check karo</button>
    <p id="Result"></p>

    <script>
        const input = document.getElementById('inputpass');
        const button = document.getElementById('checkbtn');
        const Result = document.getElementById('Result');

        function checkaro() {
            let password = input.value;
            if (password === "") {
                Result.innerText = "Please enter the password";
                Result.className = "warning";
            } else if (password === "432") {
                Result.innerText = "Hi SaifUllah";
                Result.className = "success";
            } else {
                Result.innerText = "incorrect option check again";
                Result.className = "error";
            }
        }
        button.addEventListener('click', checkaro);
    </script>
</body>
</html>
